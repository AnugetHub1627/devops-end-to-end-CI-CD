name: CI/CD Devops Pipeline

on:
  push:
    branches: [ "main" ]

# Mandatory at the workflow root level to allow safe OIDC authentication with AWS
permissions:
  id-token: write
  contents: write

jobs:
  provision-infra:
    name: "Infrastructure Automation: Terraform Apply"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Architecture
        uses: actions/checkout@v4

      - name: Authenticate with AWS via Secure OIDC Bridge
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Install Specific Terraform CLI Version
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Initialize Backend Storage Workspaces
        run: terraform init   

      - name: Check Code Style Compliance
        run: terraform fmt -check

      - name: Validate System Configuration Files
        run: terraform validate

      - name: Execute Live Deployment Code
        run: terraform apply -auto-approve -input=false

  test-and-scan:
    name: "Continuous Integration: Test & Code Scan"
    needs: provision-infra # FIXED: Correctly targets the completed infrastructure job node block above
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r app/requirements.txt pytest

      - name: Run Unit Tests
        run: pytest app/test_app.py

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-and-push:
    name: "Artifact Storage: Build & Push Docker Image"
    needs: test-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-app:${{ github.sha }}

  update-manifest:
    name: "GitOps Execution: Bump Kubernetes Version Tag"
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_GITHUB_TOKEN }}

      - name: Update Kubernetes Image Tag
        run: |
          sed -i 's|image: .*|image: '${{ secrets.DOCKERHUB_USERNAME }}'/flask-devops-app:'${{ github.sha }}'|g' k8s/deployment.yaml
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "Bump image version to ${{ github.sha }} [skip ci]"
          git push

  deploy-to-eks:
    name: "Continuous Deployment: Provision onto EKS Cluster"
    needs: update-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Refresh Local Kubeconfig
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name ci-cd-EKS

      - name: Deploy Manifests to AWS EKS Cluster
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
