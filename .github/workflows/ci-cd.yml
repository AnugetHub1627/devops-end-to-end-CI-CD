name: CI/CD Devops Pipeline...

on:
  push:
    branches:
      - main 
    paths:
      - 'app/**'
  workflow_dispatch:
# Mandatory at the workflow root level to allow safe OIDC authentication with AWS
permissions:
  id-token: write
  contents: write

jobs:
  provision-infra:
    name: "Infrastructure Automation: Terraform Apply"
    runs-on: ubuntu-latest
    outputs:
      sonar_url: ${{ steps.save-outputs.outputs.sonar_host }}
    steps:
      - name: Checkout Code Architecture
        uses: actions/checkout@v4

      - name: Authenticate with AWS via Secure OIDC Bridge
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Install Specific Terraform CLI Version
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Initialize Backend Storage Workspaces
        run: terraform init   
        working-directory: ./terraform
        
      - name: Auto-Format Code and Fix Line Endings
        run: |
          # 1. Run the formatter
          terraform fmt
          
          # 2. Tell git to completely ignore the heavy .terraform binary folders
          echo ".terraform/" >> .gitignore
          echo "*.tfstate*" >> .gitignore
          echo ".terraform.lock.hcl" >> .gitignore
          
          # 3. Check if actual configuration files (.tf) changed
          if [ -n "$(git status --porcelain | grep '\.tf')" ]; then
            echo "Formatting issues or hidden CRLF line endings detected! Committing fixes..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            # Stage only your actual terraform code files, avoiding the heavy provider binaries
            git add *.tf
            git commit -m "style: automated terraform fmt & line-ending fixes [skip ci]"
            git push
          else
            echo "Code style is perfectly clean!"
          fi
        working-directory: ./terraform



      - name: Validate System Configuration Files
        run: terraform validate
        working-directory: ./terraform
        
      - name: Execute Live Deployment Code
        run: terraform apply -auto-approve -input=false
        working-directory: ./terraform
      
      - name: Capture Infrastructure Outputs
        id: save-outputs # FIXED: Aligned step ID to match the outputs block declaration above
        run: |
          # Fetch the public IP directly from your output.tf mapping
          EC2_IP=$(terraform output -raw sonarqube_server_ip)
          echo "sonar_host=http://$EC2_IP:9000" >> $GITHUB_OUTPUT
        working-directory: ./terraform
      - name: Wait for SonarQube Server to boot
        run: sleep 90  #   
  
        
  test-and-scan:
    name: "Continuous Integration: Test & Code Scan"
    needs: provision-infra # FIXED: Correctly targets the completed infrastructure job node block above
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r app/requirements.txt pytest

      - name: Run Unit Tests
        run: pytest app/test_app.py

     # - name: SonarQube Scan
     #   uses: SonarSource/sonarqube-scan-action@v2
     #   env:
     #     SONAR_HOST_URL: ${{ needs.provision-infra.outputs.sonar_url }}
     #     SONAR_TOKEN: "Namratadvit@1627"  # <-- Hardcode this default string temporarily
 
  build-and-push:
    name: "Artifact Storage: Build & Push Docker Image"
    needs: test-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-app:${{ github.sha }}

  update-manifest:
    name: "GitOps Execution: Bump Kubernetes Version Tag"
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_GITHUB_TOKEN }}

      - name: Update Kubernetes Image Tag
        run: |
          sed -i 's|image: .*|image: '${{ secrets.DOCKERHUB_USERNAME }}'/flask-devops-app:'${{ github.sha }}'|g' k8s/deployment.yml
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add k8s/deployment.yml
          git commit -m "Bump image version to ${{ github.sha }} [skip ci]"
          git pull --rebase origin main
          git push origin main

  deploy-to-eks:
    name: "Continuous Deployment: Provision onto EKS Cluster"
    needs: update-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (Access Key and secret key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Refresh Local Kubeconfig
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name ci-cd-EKS

      - name: Deploy Manifests to AWS EKS Cluster
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
      # ==============================================================================
      # ADDED: AUTOMATED PROMETHEUS & GRAFANA MONITORING DEPLOYMENT
      # ==============================================================================
      - name: Deploy Prometheus and Grafana Stack via Helm
        run: |
          # 1. Install and update Helm chart repositories (Ensure this exact URL is pasted)
          helm repo add prometheus-community https://github.io
          helm repo update
          
          # 2. Safely create the monitoring namespace if it doesn't exist
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          
          # 3. Upgrade or install the monitoring stack automatically
          helm upgrade --install monitoring-stack prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --set prometheus.prometheusSpec.podMonitorSelectorNilUsesHelmValues=false \
            --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false

