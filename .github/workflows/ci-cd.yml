name: CI/CD Devops Pipeline

on:
  push:
    branches: [ "main" ]

# Mandatory at the workflow root level to allow safe OIDC authentication with AWS
permissions:
  id-token: write
  contents: write

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r app/requirements.txt pytest

      - name: Run Unit Tests
        run: pytest app/test_app.py

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-and-push:
    needs: test-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app  # FIXED: Point to your actual subfolder directory containing the Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flask-devops-app:${{ github.sha }}

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_GITHUB_TOKEN }}

      - name: Update Kubernetes Image Tag
        run: |
          # FIXED: Swapped out .yml for .yaml to properly match standard manifest pathing
          sed -i 's|image: .*|image: '${{ secrets.DOCKERHUB_USERNAME }}'/flask-devops-app:'${{ github.sha }}'|g' k8s/deployment.yaml
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "Bump image version to ${{ github.sha }} [skip ci]"
          git push

  deploy-to-eks:
    needs: update-manifest # Executes sequentially after the manifest code update pushes to Git
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }} # Created securely via your updated main.tf output
          aws-region: ap-south-1 # Matches your exact infrastructure zone from code

      - name: Refresh Local Kubeconfig
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name ci-cd-EKS # Explicitly targets your cluster name

      - name: Deploy Manifests to AWS EKS Cluster
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
