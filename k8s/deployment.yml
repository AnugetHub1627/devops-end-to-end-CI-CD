apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app-deployment
  labels:
    app: flask-microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-microservice
  template:
    metadata:
      labels:
        app: flask-microservice
    spec:
      containers:
      - name: flask-app
        image: anummdocker/flask-devops-app:3d3b9978c7426ad5526dfe004e1ee3bbba1c3cc1
        ports:
        - containerPort: 5000

