apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app-deployment
  labels:
    app: flask-microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-microservice
  template:
    metadata:
      labels:
        app: flask-microservice
    spec:
      containers:
      - name: flask-app
        image: anummdocker/flask-devops-app:b926757f4980bcf2f04d9fb4bb3b09f53d56d1fa
        ports:
        - containerPort: 5000

